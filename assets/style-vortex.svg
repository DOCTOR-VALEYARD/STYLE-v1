<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="STYLE-v1 — Time and Space">
  <defs>
    <radialGradient id="space" cx="68%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#2a0a3a"/>
      <stop offset="45%" stop-color="#140826"/>
      <stop offset="100%" stop-color="#05020b"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2e97"/>
      <stop offset="50%" stop-color="#b14bff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ring2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fb0"/>
      <stop offset="50%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#48e5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- fundo espaço -->
  <rect width="1200" height="420" fill="url(#space)"/>

  <!-- estrelas (cintilam) -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="130" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="300" r="1.4"><animate attributeName="opacity" values="0.6;1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="340" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="250" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="110" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="190" r="1.0"><animate attributeName="opacity" values="1;0.4;1" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="360" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="40" r="1.2"><animate attributeName="opacity" values="0.5;1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- VÓRTICE TEMPORAL (anéis girando) -->
  <g transform="translate(880 200)" filter="url(#glow)">
    <g opacity="0.9">
      <ellipse rx="210" ry="150" fill="none" stroke="url(#ring1)" stroke-width="4" stroke-dasharray="26 16" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="165" ry="116" fill="none" stroke="url(#ring2)" stroke-width="3.5" stroke-dasharray="18 12" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="120" ry="84" fill="none" stroke="url(#ring1)" stroke-width="3" stroke-dasharray="12 9" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="78" ry="54" fill="none" stroke="url(#ring2)" stroke-width="2.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- núcleo brilhante -->
    <circle r="34" fill="#c77dff" filter="url(#softglow)">
      <animate attributeName="r" values="30;40;30" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#ffffff" opacity="0.95">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nave/viajante cruzando o vórtice (forma genérica) -->
  <g>
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"
        path="M -60,330 C 260,300 520,120 980,170 S 1300,120 1320,110"/>
      <polygon points="0,0 -26,8 -18,0 -26,-8" fill="#48e5ff" filter="url(#glow)"/>
      <line x1="-18" y1="0" x2="-120" y2="0" stroke="#48e5ff" stroke-width="3" opacity="0.5"/>
    </g>
  </g>

  <!-- TÍTULO -->
  <g font-family="Verdana, Geneva, sans-serif" text-anchor="start">
    <text x="70" y="180" font-size="90" font-weight="bold" fill="url(#title)" filter="url(#glow)">STYLE-v1</text>
    <text x="74" y="230" font-size="30" letter-spacing="14" fill="#9ad8ff" font-weight="bold">TIME AND SPACE</text>
    <text x="76" y="276" font-size="19" letter-spacing="2" fill="#d8b4fe">Bot de WhatsApp • inspirado em Doctor Who</text>
    <text x="76" y="330" font-size="16" fill="#8aa0c6">by Doctor Valeyard — “O tempo não espera. Cada conversa inicia uma viagem.”</text>
  </g>
</svg>
